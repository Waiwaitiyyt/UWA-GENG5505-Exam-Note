<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENG5505 Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; }
  .app { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 14px; color: #666; margin-bottom: 1.5rem; }

  .section-tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border: 0.5px solid #ccc; border-radius: 20px; font-size: 13px; cursor: pointer; background: white; color: #444; transition: all 0.15s; }
  .tab:hover { border-color: #888; }
  .tab.active { background: #2c2c2a; color: white; border-color: #2c2c2a; }

  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .progress-bar { flex: 1; height: 4px; background: #e0dfd8; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #534AB7; border-radius: 2px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; white-space: nowrap; }

  .card-scene { perspective: 1200px; height: 380px; margin-bottom: 1.5rem; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
  .card-scene.flipped .card-inner { transform: rotateY(180deg); }

  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; overflow-y: auto; }
  .card-front { background: white; border: 0.5px solid #ddd; }
  .card-back { background: #EEEDFE; border: 0.5px solid #AFA9EC; transform: rotateY(180deg); }

  .card-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 0.85rem; }
  .card-back .card-label { color: #534AB7; }
  .card-q { font-size: 17px; font-weight: 500; line-height: 1.5; color: #1a1a1a; }
  .flip-hint { font-size: 12px; color: #aaa; margin-top: auto; padding-top: 1rem; text-align: center; }
  .card-back .flip-hint { color: #AFA9EC; }

  .section-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-bottom: 0.6rem; }
  .badge-a { background: #E6F1FB; color: #185FA5; }
  .badge-b { background: #EAF3DE; color: #3B6D11; }
  .badge-c { background: #FAEEDA; color: #854F0B; }

  /* --- Structural summary styles --- */
  .struct-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .struct-step { background: white; border: 0.5px solid #AFA9EC; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #26215C; text-align: center; }
  .struct-step em { display: block; font-size: 11px; color: #534AB7; font-style: normal; margin-top: 2px; }
  .struct-arrow { color: #AFA9EC; font-size: 14px; padding: 0 2px; }
  .struct-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pill { background: white; border: 0.5px solid #AFA9EC; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #3C3489; }
  .pill.hi { background: #534AB7; color: white; border-color: #534AB7; }
  .pill.warn { background: #FAEEDA; border-color: #EF9F27; color: #633806; }
  .struct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
  .struct-col { background: white; border: 0.5px solid #AFA9EC; border-radius: 8px; padding: 8px 10px; }
  .struct-col-title { font-size: 11px; font-weight: 500; color: #534AB7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .struct-col ul { padding-left: 1rem; font-size: 12px; color: #3C3489; }
  .struct-col li { margin-bottom: 2px; }
  .struct-ol { padding-left: 1.1rem; margin: 6px 0; }
  .struct-ol li { font-size: 13px; color: #26215C; font-weight: 500; margin-bottom: 3px; }
  .struct-ol li span { font-weight: 400; color: #534AB7; font-size: 12px; }
  .struct-section { margin-bottom: 8px; }
  .struct-section-title { font-size: 11px; font-weight: 500; color: #534AB7; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* --- Detail toggle --- */
  .detail-divider { border: none; border-top: 0.5px solid #AFA9EC; margin: 10px 0 8px; }
  .toggle-btn { display: flex; align-items: center; gap: 6px; background: white; border: 0.5px solid #AFA9EC; border-radius: 8px; padding: 6px 14px; font-size: 12px; color: #534AB7; cursor: pointer; width: fit-content; transition: all 0.15s; }
  .toggle-btn:hover { background: #CECBF6; }
  .card-detail { font-size: 13px; line-height: 1.7; color: #3C3489; margin-top: 10px; }
  .card-detail ul, .card-detail ol { padding-left: 1.2rem; margin-top: 4px; }
  .card-detail li { margin-bottom: 3px; }
  .card-detail strong { font-weight: 500; color: #26215C; }

  /* --- Nav & controls --- */
  .nav-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .nav-btn { padding: 8px 20px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; cursor: pointer; background: white; color: #333; transition: all 0.15s; }
  .nav-btn:hover:not(:disabled) { border-color: #888; background: #f8f8f8; }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn.primary { background: #534AB7; color: white; border-color: #534AB7; }
  .nav-btn.primary:hover { background: #3C3489; }
  .card-counter { font-size: 14px; color: #666; text-align: center; min-width: 80px; }
  .known-row { display: flex; gap: 8px; justify-content: center; margin-top: 1rem; }
  .known-btn { padding: 6px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; border: 0.5px solid; transition: all 0.15s; }
  .known-btn.yes { border-color: #0F6E56; color: #0F6E56; background: #E1F5EE; }
  .known-btn.yes:hover { background: #9FE1CB; }
  .known-btn.no { border-color: #993C1D; color: #993C1D; background: #FAECE7; }
  .known-btn.no:hover { background: #F5C4B3; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 1.5rem; }
  .stat { background: white; border: 0.5px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 500; }
  .stat-label { font-size: 12px; color: #888; margin-top: 2px; }
  .stat.green .stat-num { color: #0F6E56; }
  .stat.red .stat-num { color: #993C1D; }
  .stat.purple .stat-num { color: #534AB7; }
</style>
</head>
<body>
<div class="app">
  <h1>GENG5505 Exam Flashcards</h1>
  <p class="subtitle">Click card to see structure · then reveal full answer · mark to track progress</p>

  <div class="section-tabs">
    <button class="tab active" onclick="setSection('all',this)">All (<span id="cnt-all"></span>)</button>
    <button class="tab" onclick="setSection('A',this)">Section A (<span id="cnt-A"></span>)</button>
    <button class="tab" onclick="setSection('B',this)">Section B (<span id="cnt-B"></span>)</button>
    <button class="tab" onclick="setSection('C',this)">Section C (<span id="cnt-C"></span>)</button>
    <button class="tab" onclick="setSection('review',this)">To Review (<span id="cnt-review"></span>)</button>
  </div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="progress-text" id="prog-text">0%</div>
  </div>

  <div class="card-scene" id="card-scene" onclick="handleCardClick(event)">
    <div class="card-inner">
      <div class="card-face card-front">
        <div class="section-badge" id="card-badge"></div>
        <div class="card-label">Question</div>
        <div class="card-q" id="card-q"></div>
        <div class="flip-hint">Click to see answer structure →</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">Answer</div>
        <div id="card-summary"></div>
        <hr class="detail-divider">
        <button class="toggle-btn" id="toggle-btn" onclick="toggleDetail(event)"><span id="toggle-icon">▼</span><span id="toggle-text"> Show full answer</span></button>
        <div class="card-detail" id="card-detail" style="display:none"></div>
        <div class="flip-hint">← Click card to return</div>
      </div>
    </div>
  </div>

  <div class="known-row" id="known-row" style="display:none">
    <button class="known-btn yes" onclick="markKnown(true)">✓ Got it</button>
    <button class="known-btn no" onclick="markKnown(false)">✗ Need to review</button>
  </div>

  <div class="nav-row" style="margin-top:1rem">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← Previous</button>
    <div class="card-counter" id="card-counter"></div>
    <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Next →</button>
  </div>

  <div class="stats">
    <div class="stat purple"><div class="stat-num" id="s-total">0</div><div class="stat-label">Cards in set</div></div>
    <div class="stat green"><div class="stat-num" id="s-known">0</div><div class="stat-label">Got it</div></div>
    <div class="stat red"><div class="stat-num" id="s-review">0</div><div class="stat-label">To review</div></div>
  </div>
</div>

<script>
const cards = [
  {
    section:'A',
    q:'From the project, explain the 4 stages of the project and why each of them is important.',
    summary:`<div class="struct-flow">
      <div class="struct-step">Concept<em>Identify &amp; justify</em></div>
      <div class="struct-arrow">→</div>
      <div class="struct-step">Planning<em>Schedule &amp; allocate</em></div>
      <div class="struct-arrow">→</div>
      <div class="struct-step">Execution<em>Monitor &amp; control</em></div>
      <div class="struct-arrow">→</div>
      <div class="struct-step">Finalisation<em>Handover &amp; review</em></div>
    </div>
    <div class="struct-section" style="margin-top:10px">
      <div class="struct-section-title">Why each matters</div>
      <div class="struct-pills">
        <span class="pill">Concept → prevents miscommunication</span>
        <span class="pill">Planning → defines scope &amp; budget</span>
        <span class="pill">Execution → ensures quality</span>
        <span class="pill">Finalisation → lessons learned</span>
      </div>
    </div>`,
    a:`<strong>4 stages: concept, planning, execution, and finalisation</strong>
<br><br>
<strong>Concept stage:</strong><br>
This is the initial stage of the project — where all the idea is initially created, and the fundamental understanding of the project begins to make shape.
<br><br>
<strong>Why?</strong>
<ul>
<li>One of the most common reasons why project fail is due to miscommunication and misunderstanding and clarity between expectation and the project's final output.</li>
<li>Because many stakeholders ignore the basic principle of project management which is identify the problem before you try to solve it.</li>
<li>Concept stage provides this identification, as it requires that the project is correctly justified, investigated, assessed, and approved.</li>
</ul>
The concept stage seeks to capture, document, and clarify relevant information on 4 inputs constrain found in every project (time, cost, resources, and specification).
<br><br>
<em>E.g. For the PCH project the concept stage began with the purpose to build a new tertiary children hospital to replace the old rundown hospital. Initial preliminary goals were determined, economical, social and environmental issues were raised, impact assessment was made. The budget was approximated at 1.2 billion with the location set in Nedlands. The design of the hospital was initialised with around 290 beds and lots of bright colours tailored to kids. All in all, the purpose of this stage is to identify the project goals, deliverables and something which prepare for the planning stage.</em>
<br><br>
<strong>Planning Stage:</strong><br>
The second stage, all the work required for the successful completion of the project is undertaken and the scope of the project is clearly defined.
<ul>
<li>All work required is planned and scheduled</li>
<li>Objectives are finalised, resources allocated, quality is determined, final cost approved, agreement on timing</li>
</ul>
<em>In the planning stage, the design were detailed further, budgets were set at 1.2 billion, funding by WA government, and resources were allocated. Project time line was defined and outlines each phase of construction, estimated opening at June 2015.</em>
<br><br>
<strong>Execution:</strong><br>
In this stage, it involves monitoring and controlling, the implementation of the work that was proposed in the planning stage. Performance, scope and quality checks ensure the project is up to standard.
<br><em>For PCH, in execution phase, the physical construction started, delay occurred due to asbestos and water contamination, timeline was reviewed, revised and updated several times due to a multitude of issues.</em>
<br><br>
<strong>Finalisation:</strong><br>
The last stage, this is to handover to the client. Lesson learnt. Resources are discarded or reallocated. Evaluation of the project.
<br><em>In finalisation, it involves the acceptance and handover of the new PCH hospital from the construction company John Holland to the government of WA. Overall the project finished with many challenges and obstacles, with published reports from government and consulting companies evaluating and reviewing the processes.</em>`
  },
  {
    section:'A',
    q:'Explain the sustainable approach and how it is consistent with TBL. Explain how it could improve the project by applying it to every stage.',
    summary:`<div class="struct-section">
      <div class="struct-section-title">TBL — Triple Bottom Line</div>
      <div class="struct-pills">
        <span class="pill">Economic — ROI &amp; prosperity</span>
        <span class="pill">Environmental — emissions &amp; waste</span>
        <span class="pill">Social — community &amp; fairness</span>
      </div>
    </div>
    <div class="struct-section" style="margin-top:8px">
      <div class="struct-section-title">Applied across 4 stages</div>
      <div class="struct-flow">
        <div class="struct-step">Concept<em>Localise, LED, water recycle</em></div>
        <div class="struct-arrow">→</div>
        <div class="struct-step">Planning<em>Risk ID, façade design</em></div>
        <div class="struct-arrow">→</div>
        <div class="struct-step">Execution<em>Eco impact studies</em></div>
        <div class="struct-arrow">→</div>
        <div class="struct-step">Finalisation<em>Checklists, outreach</em></div>
      </div>
    </div>`,
    a:`A sustainable approach is the company's ability to achieve its business goals and increase long-term stakeholder value by integrating economic, social, and environmental opportunities into its business.
<br><br>
A project can prioritise its long-term financial success while also treating its stakeholders fairly, the two goals are not in conflict.
<br><br>
<strong>Indicators for measuring sustainability:</strong>
<ul>
<li><strong>Economic:</strong> financial health, economic performance, return of investment, risks (will the project generate prosperity)</li>
<li><strong>Environmental:</strong> resource extraction, emissions, air/water, waste, hazardous materials, will the project cause long term damage to the environment.</li>
<li><strong>Social:</strong> internal HR, external population, the community, will the project be implemented in a socially responsible manner and benefit the affected communities in a fair and equal way</li>
<li><strong>Sustainability:</strong> meeting the needs of people today without compromising the ability of future generations to meet their own needs.</li>
</ul>
<strong>TBL in the 4 stages:</strong>
<br><br>
<strong>Concept stage:</strong>
<ul>
<li>Reduce the amount of waste produced by putting up sustainable consideration not only for materials but for process approaches</li>
<li>Localise the project</li>
<li>Utilising local construction company John Holland; minimise the damage to the environment, have water recycling strategies and LED lights</li>
<li>Tailor to kids (social impact)</li>
<li>1.2 billion dollar project that will boost the economy</li>
</ul>
<strong>Planning stage:</strong>
<ul>
<li>With specialist identified the possible risks of the project, not only the scope management plan accounted for this, but it would also ensure that TBL was considered and reduced the time and cost wasted trying to fix environmental damage</li>
<li>TBL was considered greatly in the planning process.</li>
<li>Building itself designed in a way that uses double skinned façade during construction, which greatly saves energy in the long run</li>
<li>LED lights installed to save energy</li>
<li>More bright colours and play area</li>
</ul>
<strong>Execution Process:</strong>
<ul>
<li>TBL should be addressed throughout the execution phase taking into consideration the environmental risks of the man-made construction on the ecosystem</li>
<li>Studies should be performed at all stages in the project that concludes that there will not be any significant environmental impact</li>
<li>Sustainable thinking could save labour forces, natural resources and energy</li>
<li>The intellectual property it creates will form a long-term return for the management team as well as the high-level stakeholder participation</li>
</ul>
<strong>Finalisation stage:</strong>
<ul>
<li>It is not sufficient to determine the project success by only checking that the project scope has been delivered</li>
<li>Further analysis required with TBL</li>
<li>Quality checklists are a tool that can be used to ensure TBL are considered within the quality analysis of the project</li>
<li>Companies can establish positive image to the public by promoting their consideration in sustainable development at the finalisation stage.</li>
<li>PCH play a vital role in community engagement in terms of social aspect, offers outreach program after the project completion and help the vulnerable people in rural areas or people with low SES</li>
</ul>`
  },
  {
    section:'B',
    q:'Differentiate the 3 numerical methods of categorising investments. Which is the most exhaustive?',
    summary:`<div class="struct-grid">
      <div class="struct-col">
        <div class="struct-col-title">Payback Period</div>
        <div style="font-size:12px;color:#3C3489">Time to recover investment<br><br>Cost ÷ Annual revenue</div>
      </div>
      <div class="struct-col">
        <div class="struct-col-title">ROI</div>
        <div style="font-size:12px;color:#3C3489">Profit as % of investment<br><br>(Net profit ÷ Investment) × 100</div>
      </div>
    </div>
    <div style="margin-top:8px;background:#534AB7;border-radius:8px;padding:8px 12px;color:white;font-size:13px">
      ★ Most exhaustive: <strong style="color:white">NPV</strong> — projected profitability based on future cash flows &amp; discounted interest rate
    </div>`,
    a:`<strong>Payback period</strong> — the time taken to earn back the money invested
<br>Cost of project / annual cash revenue
<br><br>
<strong>Return on investment</strong> — overall profit on an investment calculated as % of the total amount invested
<br>(net profit) / total investment &times; 100
<br><br>
<strong>Net present value (most exhaustive)</strong> — the projected profitability of an investment
<ul>
<li>Based on the future anticipated cash-flows and discounted interest rate.</li>
</ul>`
  },
  {
    section:'B',
    q:'Refer to your group experience, explain the stages of team development.',
    summary:`<div class="struct-section-title" style="font-size:11px;font-weight:500;color:#534AB7;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Tuckman's Model — not a linear process</div>
    <div class="struct-flow" style="flex-direction:column;align-items:flex-start;gap:6px">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="struct-step" style="min-width:110px">Forming</div>
        <span style="font-size:12px;color:#534AB7">Members join, define purpose, structure &amp; leadership</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="struct-step" style="min-width:110px">Storming</div>
        <span style="font-size:12px;color:#534AB7">Conflicts arise — clashes, leadership issues</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="struct-step" style="min-width:110px">Norming</div>
        <span style="font-size:12px;color:#534AB7">Code of conduct formed, norms agreed</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="struct-step" style="min-width:110px">Performing</div>
        <span style="font-size:12px;color:#534AB7">Members work in a united manner</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <div class="struct-step" style="min-width:110px">Adjourning</div>
        <span style="font-size:12px;color:#534AB7">Project finishes, team disbands</span>
      </div>
    </div>`,
    a:`Not a linear process
<ul>
<li><strong>Forming</strong> – member join and begin the process of defining the group's purpose, structure and leadership<br><em>(group forming in class and first meeting)</em></li>
<li><strong>Storming</strong> – when conflicts arise, personality clashes, roles not matching expectations, leadership issues<br><em>(meeting 2,3 no clear direction to get project progress)</em></li>
<li><strong>Norming</strong> – natural code of conduct formed and norms developed, shared and agreed<br><em>(meeting on regular basis with updates on project and progressing)</em></li>
<li><strong>Performing</strong> – members of the team perform assigned work in united manner<br><em>(group actively contributing to the report and meeting on regular basis)</em></li>
<li><strong>Adjourning</strong> – the project finish and the team disband<br><em>(project submitted, final presentation completed)</em></li>
</ul>`
  },
  {
    section:'B',
    q:'What are the 10 key competencies for running a team based on PMBOK?',
    summary:`<ol class="struct-ol">
      <li>Stakeholder management</li>
      <li>Scope management</li>
      <li>Time management</li>
      <li>Cost management</li>
      <li>Quality management</li>
      <li>Human resource management</li>
      <li>Communication management</li>
      <li>Risk management</li>
      <li>Procurement management</li>
      <li>Integration management</li>
    </ol>`,
    a:`<ol>
<li><strong>Stakeholder management</strong> — ensure stakeholders are identified and well informed and engaged with throughout the project</li>
<li><strong>Scope management</strong> — process ensuring that all work required by the project &amp; only this work is included</li>
<li><strong>Time management</strong> — process ensuring that project is completed in a timely manner</li>
<li><strong>Cost management</strong> — the project completed within the approved budget</li>
<li><strong>Quality management</strong> — ensure it will satisfy the needs (standards, definitions, specification, use) for which it was undertaken</li>
<li><strong>Human resource management</strong> — effective use can be made of all people involved in the project</li>
<li><strong>Communication management</strong> — ensure all communication is complete, timely, appropriate &amp; targeted</li>
<li><strong>Risk management</strong> — all project risks are clearly identified, comprehensively analysed &amp; responded to proactively</li>
<li><strong>Procurement management</strong> — process required to acquire all external goods &amp; services for the project</li>
<li><strong>Integration management</strong> — all aspects of the project are effectively coordinated &amp; managed</li>
</ol>`
  },
  {
    section:'B',
    q:'What are the important considerations for good communication? Choose 2 stakeholders and discuss some of the barriers to communication.',
    summary:`<div class="struct-section">
      <div class="struct-section-title">Good communication must be</div>
      <div class="struct-pills">
        <span class="pill">Clear</span><span class="pill">Concise</span><span class="pill">Accurate</span><span class="pill">Timely</span><span class="pill">Targeted</span><span class="pill">Appropriate</span><span class="pill">Complete</span>
      </div>
    </div>
    <div class="struct-section" style="margin-top:8px">
      <div class="struct-section-title">Communication model</div>
      <div class="struct-flow">
        <div class="struct-step">Sender</div><div class="struct-arrow">→</div>
        <div class="struct-step">Encode</div><div class="struct-arrow">→</div>
        <div class="struct-step">Message</div><div class="struct-arrow">→</div>
        <div class="struct-step">Decode</div><div class="struct-arrow">→</div>
        <div class="struct-step">Receiver</div>
      </div>
    </div>
    <div class="struct-section" style="margin-top:8px">
      <div class="struct-section-title">Barriers (e.g. PM → Contractor)</div>
      <div class="struct-pills">
        <span class="pill warn">Misinterpretation</span><span class="pill warn">Scope changes not shared</span><span class="pill warn">Incomplete docs</span><span class="pill warn">Unclear terminology</span>
      </div>
    </div>`,
    a:`<ul>
<li>Essential for project's success, to ensure all parties are involved in the project</li>

    a:`<strong>Utilitarianism</strong> — An action judged as ethical or unethical based on the outcome. Future approach looking with the thinking does 'the end justifies the mean'.

<strong>Issues:</strong>
<ul>
<li>Minority rights at risk</li>
<li>Who decides what good is</li>
<li>What counts as consequence</li>
</ul>

<br><br>
<strong>Deontology</strong> – An action judged as ethical standing alone and without regard to consequences.
<ul>
<li>Actions are judged based on their inherent moral status, without regard of the consequence</li>
<li>Backward-looking, duty-based approach</li>
<li>Fundamental rules or duties that individual must adhere to, regardless of the outcomes</li>
<li>Focuses on the means rather than outcome</li>
<li>Act as if, through your actions, you were making universal law for everyone to follow</li>
</ul>
<em>E.g. man turning down the promotion which required him to commit forgery as it's against his principles.</em>
<br><br>
<strong>Virtue Based</strong> – focus is on the individual not the action.
<ul>
<li>Concentrates on the person who performs the act</li>
<li>Good person will do the right thing</li>
</ul>`

const knownMap = JSON.parse(localStorage.getItem('geng5505_known') || '{}');
let currentSection = 'all';
let filteredCards = [];
let currentIdx = 0;
let isFlipped = false;
let detailVisible = false;

function getFiltered() {
  if (currentSection === 'all') return cards.map((_,i)=>i);
  if (currentSection === 'review') return cards.map((_,i)=>i).filter(i=>knownMap[i]===false);
  return cards.map((_,i)=>i).filter(i=>cards[i].section===currentSection);
}

function updateCounts() {
  document.getElementById('cnt-all').textContent = cards.length;
  ['A','B','C'].forEach(s => document.getElementById('cnt-'+s).textContent = cards.filter(c=>c.section===s).length);
  document.getElementById('cnt-review').textContent = cards.filter((_,i)=>knownMap[i]===false).length;
}

function setSection(s, el) {
  currentSection = s;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  filteredCards = getFiltered();
  currentIdx = 0;
  resetCard();
  renderCard();
}

function resetCard() {
  isFlipped = false;
  detailVisible = false;
  document.getElementById('card-scene').classList.remove('flipped');
  document.getElementById('card-detail').style.display = 'none';
  document.getElementById('toggle-icon').textContent = '▼';
  document.getElementById('toggle-text').textContent = ' Show full answer';
  document.getElementById('known-row').style.display = 'none';
}

function renderCard() {
  if (filteredCards.length === 0) {
    document.getElementById('card-q').textContent = 'No cards in this category.';
    document.getElementById('card-summary').innerHTML = '';
    document.getElementById('card-detail').innerHTML = '';
    document.getElementById('card-badge').textContent = '';
    document.getElementById('card-counter').textContent = '0 / 0';
    document.getElementById('prog-fill').style.width = '0%';
    document.getElementById('prog-text').textContent = '0%';
    updateStats(); return;
  }
  const realIdx = filteredCards[currentIdx];
  const card = cards[realIdx];
  const badge = document.getElementById('card-badge');
  badge.textContent = 'Section ' + card.section;
  badge.className = 'section-badge badge-' + card.section.toLowerCase();
  document.getElementById('card-q').textContent = card.q;
  document.getElementById('card-summary').innerHTML = card.summary;
  document.getElementById('card-detail').innerHTML = card.a;
  document.getElementById('card-counter').textContent = (currentIdx+1) + ' / ' + filteredCards.length;
  const pct = Math.round((currentIdx+1)/filteredCards.length*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent = pct+'%';
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === filteredCards.length-1;
  updateStats();
}

function updateStats() {
  document.getElementById('s-total').textContent = filteredCards.length;
  document.getElementById('s-known').textContent = filteredCards.filter(i=>knownMap[i]===true).length;
  document.getElementById('s-review').textContent = filteredCards.filter(i=>knownMap[i]===false).length;
}

function handleCardClick(e) {
  if (e.target.closest('.toggle-btn') || e.target.closest('.known-btn')) return;
  if (!isFlipped) {
    document.getElementById('card-scene').classList.add('flipped');
    isFlipped = true;
    document.getElementById('known-row').style.display = 'flex';
  } else {
    resetCard();
  }
}

function toggleDetail(e) {
  e.stopPropagation();
  detailVisible = !detailVisible;
  const det = document.getElementById('card-detail');
  const icon = document.getElementById('toggle-icon');
  const btn = document.getElementById('toggle-btn');
  det.style.display = detailVisible ? 'block' : 'none';
  icon.textContent = detailVisible ? '▲' : '▼';
  document.getElementById('toggle-text').textContent = detailVisible ? ' Hide details' : ' Show full answer';
  if (detailVisible) det.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function navigate(dir) {
  const n = currentIdx + dir;
  if (n < 0 || n >= filteredCards.length) return;
  currentIdx = n;
  resetCard();
  renderCard();
}

function markKnown(known) {
  const realIdx = filteredCards[currentIdx];
  knownMap[realIdx] = known;
  localStorage.setItem('geng5505_known', JSON.stringify(knownMap));
  updateCounts(); updateStats();
  if (currentIdx < filteredCards.length-1) { currentIdx++; resetCard(); renderCard(); }
  else { resetCard(); renderCard(); }
}

updateCounts();
filteredCards = getFiltered();
renderCard();
</script>
